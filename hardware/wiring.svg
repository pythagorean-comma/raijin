<svg viewBox="0 0 990 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Raijin wiring diagram: power bank, switch, supply WAGOs, Pico 2 W, MAX98357A amplifier, Adafruit MOSFET driver, and three LED strips chained together across its output terminals">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8378"></path>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cfc8bd;stroke-width:1.4}
      .ttl{font:600 12.5px -apple-system,Segoe UI,Roboto,sans-serif;fill:#1c1a17}
      .sub{font:11px -apple-system,Segoe UI,Roboto,sans-serif;fill:#6b645c}
      .pin{font:600 10.5px ui-monospace,Menlo,Consolas,monospace;fill:#3d3831}
      .wl {font:10.5px -apple-system,Segoe UI,Roboto,sans-serif;fill:#6b645c}
      .warn{font:600 10.5px -apple-system,Segoe UI,Roboto,sans-serif;fill:#a2440e}
      .mark{font:600 12px ui-monospace,Menlo,Consolas,monospace;fill:#7a5a12}
      .pw{stroke:#c1440e;stroke-width:2.2;fill:none}
      .gnd{stroke:#33302b;stroke-width:2.2;fill:none}
      .sig{stroke:#1d6a75;stroke-width:2;fill:none}
      .aud{stroke:#6b4fa8;stroke-width:2;fill:none}
      .thin{stroke:#8a8378;stroke-width:1.2;fill:none}
    </style>
  </defs>

  <rect x="0" y="0" width="990" height="900" fill="#fbfaf8"></rect>

  <!-- POWER COLUMN -->
  <rect class="box" x="30" y="34" width="182" height="58" rx="8"></rect>
  <text class="ttl" x="46" y="57">USB power bank</text>
  <text class="sub" x="46" y="75">5 V, 2 A+ output</text>

  <path class="thin" d="M121,92 L121,122" marker-end="url(#ar)"></path>
  <text class="wl" x="128" y="104">USB-A male pigtail:</text>
  <text class="wl" x="128" y="118">red to the switch, black to GND</text>

  <!-- pigtail black bypasses the switch and goes straight to the GND WAGO -->
  <path class="gnd" d="M64,92 L16,92 L16,276 L30,276"></path>

  <rect class="box" x="30" y="126" width="182" height="44" rx="8"></rect>
  <text class="ttl" x="46" y="145">Master power switch</text>
  <text class="sub" x="46" y="161">6.3 mm spades, in the red wire</text>

  <path class="thin" d="M121,170 L121,194" marker-end="url(#ar)"></path>

  <rect x="30" y="198" width="182" height="40" rx="8" fill="#fdeee6" stroke="#e0a184" stroke-width="1.4"></rect>
  <text class="ttl" x="46" y="217">+5 V WAGO</text>
  <text class="sub" x="46" y="231">221-415 · all 5 ways used</text>

  <rect x="30" y="256" width="182" height="40" rx="8" fill="#eeece9" stroke="#a8a29a" stroke-width="1.4"></rect>
  <text class="ttl" x="46" y="275">GND WAGO</text>
  <text class="sub" x="46" y="289">221-415 · all 5 ways used</text>

  <path class="thin" d="M198,238 L198,256"></path>
  <path class="pw" d="M186,238 L210,238"></path>
  <path class="gnd" d="M186,256 L210,256"></path>
  <text class="wl" x="34" y="320">1000 µF capacitor legs push</text>
  <text class="wl" x="34" y="334">straight into the two WAGOs</text>
  <text class="wl" x="34" y="348">(stripe = negative = GND)</text>

  <!-- BUS RAILS -->
  <path class="pw" d="M212,218 L244,218 L244,660 L259,660 A7,7 0 0 1 273,660 L310,660"></path>
  <path class="gnd" d="M212,276 L266,276"></path>
  <path class="gnd" d="M266,244 L266,705 L310,705"></path>

  <!-- Pico power branch, with the Schottky diode -->
  <path class="pw" d="M244,218 L282,218"></path>
  <path d="M282,211 L282,225 L297,218 z" fill="#fff" stroke="#c1440e" stroke-width="1.8" stroke-linejoin="round"></path>
  <path class="pw" d="M297,210 L297,226"></path>
  <path class="pw" d="M300,218 L310,218"></path>
  <text class="wl" x="264" y="202">1N5817</text>
  <path class="gnd" d="M266,244 L310,244"></path>

  <!-- amp power -->
  <path class="pw" d="M244,400 L259,400 A7,7 0 0 1 273,400 L310,400"></path>
  <path class="gnd" d="M266,424 L310,424"></path>

  <!-- PICO -->
  <rect class="box" x="310" y="190" width="232" height="130" rx="8"></rect>
  <text class="ttl" x="326" y="213">Raspberry Pi Pico 2 W</text>
  <text class="sub" x="326" y="229">on a screw-terminal expansion board</text>
  <text class="pin" x="326" y="252">VSYS pin 39 · GND pin 38</text>
  <text class="pin" x="326" y="272">GP16 17 18 19 → amplifier</text>
  <text class="pin" x="326" y="292">GP22 → MOSFET driver In</text>

  <!-- AMP -->
  <rect class="box" x="310" y="372" width="232" height="120" rx="8"></rect>
  <text class="ttl" x="326" y="395">MAX98357A I2S amplifier</text>
  <text class="sub" x="326" y="411">3.2 W into 4 Ω · 2.5–5.5 V</text>
  <text class="pin" x="326" y="434">VIN · GND</text>
  <text class="pin" x="326" y="452">BCLK · LRC · DIN · SD</text>
  <text class="sub" x="326" y="472">GAIN: leave unconnected</text>

  <!-- Pico -> amp, three I2S lines plus the shutdown line -->
  <path class="sig" d="M345,320 L345,372"></path>
  <path class="sig" d="M395,320 L395,372"></path>
  <path class="sig" d="M445,320 L445,372"></path>
  <path class="sig" d="M495,320 L495,372"></path>
  <text class="wl" x="316" y="348">GP16</text>
  <text class="wl" x="366" y="348">GP17</text>
  <text class="wl" x="416" y="348">GP18</text>
  <text class="wl" x="466" y="348">GP19</text>

  <!-- SPEAKER -->
  <rect class="box" x="656" y="392" width="200" height="86" rx="8"></rect>
  <text class="ttl" x="672" y="415">Speaker</text>
  <text class="sub" x="672" y="432">4 Ω · 3 W · 50–66 mm</text>
  <text class="sub" x="672" y="452">Do not connect either leg</text>
  <text class="sub" x="672" y="466">to GND. It is a bridged amp.</text>

  <!-- amp -> speaker -->
  <path class="aud" d="M542,430 L656,428"></path>
  <text class="wl" x="556" y="420">speaker + / −</text>

  <!-- Pico -> MOSFET driver, via the STEMMA cable's signal wire -->
  <path class="sig" d="M542,300 L568,300 L568,422 A7,7 0 0 1 568,436 L568,548 A7,7 0 0 1 568,562 L568,598 L430,598 L430,624"></path>
  <text class="wl" x="440" y="590">GP22</text>

  <!-- MOSFET DRIVER -->
  <rect class="box" x="310" y="624" width="210" height="130" rx="8"></rect>
  <text class="ttl" x="326" y="652">Adafruit MOSFET driver</text>
  <text class="sub" x="326" y="668">ADA5648 · 1 ch · 3.3 V logic</text>
  <text class="pin" x="326" y="692">V+ · GND · In · Out</text>
  <text class="sub" x="326" y="714">Low side switch. In is driven</text>
  <text class="sub" x="326" y="728">from GP22. The strips hang</text>
  <text class="sub" x="326" y="742">across the + and − terminals.</text>

  <!-- Supply into the driver, via the STEMMA cable -->
  <text class="wl" x="272" y="654">V+</text>
  <text class="wl" x="272" y="698">GND</text>

  <!-- + terminal to strip 1, then links along to strips 2 and 3 -->
  <path class="pw" d="M520,664 L600,664 L600,570 L833,570 L833,600"></path>
  <text class="wl" x="527" y="658">+</text>
  <path class="pw" d="M846,610 L872,610"></path>
  <path class="pw" d="M898,610 L924,610"></path>

  <!-- switched − terminal to strip 1, then links along -->
  <path class="gnd" d="M520,714 L600,714 L600,800 L833,800 L833,760"></path>
  <text class="wl" x="527" y="708">−</text>
  <path class="gnd" d="M846,750 L872,750"></path>
  <path class="gnd" d="M898,750 L924,750"></path>

  <rect x="820" y="600" width="26" height="160" rx="6" fill="#f6d9a8" stroke="#d9a441"></rect>
  <rect x="872" y="600" width="26" height="160" rx="6" fill="#f6d9a8" stroke="#d9a441"></rect>
  <rect x="924" y="600" width="26" height="160" rx="6" fill="#f6d9a8" stroke="#d9a441"></rect>

  <text class="mark" x="833" y="634" text-anchor="middle">+</text>
  <text class="mark" x="885" y="634" text-anchor="middle">+</text>
  <text class="mark" x="937" y="634" text-anchor="middle">+</text>
  <text class="mark" x="833" y="734" text-anchor="middle">−</text>
  <text class="mark" x="885" y="734" text-anchor="middle">−</text>
  <text class="mark" x="937" y="734" text-anchor="middle">−</text>

  <text class="ttl" x="830" y="850">LED strips</text>
  <text class="sub" x="830" y="864">3 × 150 mm COB, chained</text>

  <text class="warn" x="540" y="850">The strip negatives go only to the driver's</text>
  <text class="warn" x="540" y="864">− terminal, never the GND WAGO.</text>

  <!-- LEGEND -->
  <path class="pw" d="M40,884 L72,884"></path>   <text class="wl" x="80" y="888">+5 V</text>
  <path class="gnd" d="M124,884 L156,884"></path> <text class="wl" x="164" y="888">GND</text>
  <path class="sig" d="M208,884 L240,884"></path> <text class="wl" x="248" y="888">signal</text>
  <path class="aud" d="M300,884 L332,884"></path> <text class="wl" x="340" y="888">speaker</text>
  <text class="wl" x="420" y="888">Crossing lines are not connected. The small hops show one wire passing over another.</text>
</svg>
